<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Browser tab icon: a lidded cooking pot, so the tab reads as kitchenware at
    a glance.

    The shop name is deliberately not drawn here. Browsers render a favicon at
    16px, where lettering this small turns into grey mush; the name already
    sits beside the icon in the tab title. The installed app icons in
    public/icons/ do carry the name, because the OS shows those much larger.

    Same geometry as public/icons/*.png and src/components/brand/PotMark.tsx.
    Change one, change all three. Vector, so it stays sharp on any display.
    Replace this file with real artwork when it exists — no code change needed,
    Next.js serves whatever is here.
  -->
  <rect width="64" height="64" rx="14" fill="#111110"/>
  <!-- knob, the single accent colour -->
  <circle cx="32" cy="16.47" r="3.16" fill="#ad4728"/>
  <!-- lid: a shallow dome on a flat rim -->
  <path d="M21.33 22.72A10.67 4.83 0 0 1 42.67 22.72Z" fill="#ffffff"/>
  <rect x="13.63" y="22.72" width="36.75" height="4.64" rx="2.09" fill="#ffffff"/>
  <!-- handles -->
  <rect x="10.66" y="32.46" width="6.31" height="5.1" rx="2.3" fill="#ffffff"/>
  <rect x="47.03" y="32.46" width="6.31" height="5.1" rx="2.3" fill="#ffffff"/>
  <!-- tapered body with a softened foot -->
  <path d="M14.37 27.36H49.63L46.85 46.38Q46.11 51.49 41 51.49H23Q17.89 51.49 17.15 46.38Z" fill="#ffffff"/>
</svg>
